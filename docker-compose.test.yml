# Run the full calc-service test suite inside Docker.
# Usage:  docker compose -f docker-compose.test.yml run --rm test
#
# This builds pyswisseph from source inside the container, so it works on
# any OS without a local C++ toolchain.  First build takes ~60s (cached after).
# The Swiss ephemeris data is fetched and checksum-verified during that build,
# so nothing needs to be downloaded by hand beforehand.

services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      CALC_SERVICE_TOKEN: test
      PUBLIC_SOURCE_URL: https://example.com
    # NO ephemeris volume, deliberately. Dockerfile.test bakes the verified
    # data into the image. A host bind-mount here would SHADOW those files —
    # and Docker silently creates an empty directory when the host path does
    # not exist, which would put the suite back on the Moshier fallback with
    # nothing visibly wrong. That was the previous arrangement.
