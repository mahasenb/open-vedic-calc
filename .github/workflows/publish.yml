name: Build and publish image

on:
  push:
    branches: [main]
    # Docs-only changes don't change the image — skip the build.
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  release:
    types: [published]

# Least-privilege GITHUB_TOKEN, as the workflow DEFAULT. The `publish` job below
# already declares its own contents: read + packages: write (it logs in to GHCR
# and pushes), but the `test` job declared nothing and so inherited the
# repository default token scope — read across EVERY scope (actions, checks,
# issues, packages, pull-requests, statuses, ...), when all it does is clone and
# run pytest. Declaring the default here also means any job added later starts
# least-privilege and must opt in to more explicitly. A job-level block fully
# REPLACES this default, so `publish` keeps exactly the two scopes it declares.
# This matters more here than in a private repo: any fork can open a pull
# request, so every needless scope on the workflow token is reachable from an
# untrusted PR (and note `publish` is already `if: github.event_name !=
# 'pull_request'`, so the packages: write path never runs for one).
permissions:
  contents: read

# Cancel a superseded run when a new commit lands on the same PR/branch, so the
# test job doesn't run to completion on every intermediate push.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      # This job runs with the Moshier fallback (no Swiss ephemeris data files here);
      # line coverage is identical to a Swiss run — only numeric values differ, and
      # tests/test_swiss_ephemeris.py skips. It is NOT the accuracy gate: real Swiss
      # data is exercised by test.yml's `swiss-ephemeris` job (CALC-1), which fetches
      # the checksum-pinned data files and re-runs this same suite with
      # REQUIRE_SWISS_EPHEMERIS=1 so those tests hard-fail instead of skipping.
      # --cov enforces fail_under from pyproject [tool.coverage.report] (92).
      - run: pytest tests/ --cov --cov-report=term-missing
      # ci/tests/ lives outside the tests/ tree by design (it tests the CI
      # gate script itself, not the calc engine) — pytest tests/ never
      # collects it. Without this step, a future edit that weakens
      # _FORBIDDEN in ci/check_no_proprietary_refs.py would pass CI green
      # right up through the image build/publish path.
      - run: pytest ci/tests/ -q

  publish:
    needs: test
    # Never publish from a pull request — main pushes and releases only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Boot BuildKit from Google's Docker Hub pull-through mirror, and route
          # every docker.io pull (incl. the python:3.10-slim base) through it.
          # Anonymous registry-1.docker.io pulls on GitHub-hosted runners
          # intermittently time out / rate-limit — run #11 failed booting
          # moby/buildkit ("Get https://registry-1.docker.io/v2/: context
          # deadline exceeded"). mirror.gcr.io is reliable and needs no auth.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Embed the exact source commit so /source returns the authoritative
          # cache key in production (the image is built without a .git dir, so
          # the in-container git rev-parse fallback can never fire).
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
