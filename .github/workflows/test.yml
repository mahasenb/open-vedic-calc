name: Tests

# Compiles pyswisseph and runs pytest — skipped for docs-only changes to save
# Actions minutes. The boundary gate (ci.yml) still runs on those changes.
# Also runs weekly (independent of any push/PR) so a newly disclosed CVE in a
# pinned dependency is caught even on a repo with no recent commits.
#
# Three jobs:
#   test              — the fast suite on the Moshier fallback (no data files), plus
#                       the gate regression suite and the frozen-lock CVE scan.
#   swiss-ephemeris   — CALC-1: the SAME suite against the REAL Swiss ephemeris data
#                       files, which is what production runs on. Until this job
#                       existed, nothing automated had ever validated this engine
#                       against real ephemeris data.
#   docker-test-image — CALC-7: builds Dockerfile.test (frozen install).
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

# Least-privilege GITHUB_TOKEN. With no explicit block a job inherits the
# repository default token scope, which is read across EVERY scope (actions,
# checks, issues, packages, pull-requests, statuses, ...) — far more than this
# workflow uses. Every job only clones the repo: `test` runs pytest + pip-audit,
# `swiss-ephemeris` additionally fetches public data files over plain HTTPS (no
# credentials of any kind), and `docker-test-image` builds Dockerfile.test with
# push: false (its buildx layer cache uses the Actions cache service, which is
# authenticated by the runtime token, not GITHUB_TOKEN). Both of those also use
# actions/cache, likewise authenticated by the runtime token rather than
# GITHUB_TOKEN. So contents: read is the whole requirement —
# note that publish.yml, which genuinely pushes to GHCR, declares its own
# packages: write on the publishing job only. This matters more here than in a
# private repo: any fork can open a pull request, so every needless scope on the
# workflow token is reachable from an untrusted PR.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        # Scheduled (weekly CVE-only) runs skip pytest — nothing about the code
        # changed, only the vulnerability database might have.
        if: github.event_name != 'schedule'
        run: pytest tests/ -q
      - name: Run CI gate regression suite
        # ci/tests/ lives outside the tests/ tree by design (it tests the CI
        # gate script itself, not the calc engine) — pytest tests/ never
        # collects it. Without this step, a future edit that weakens
        # _FORBIDDEN in ci/check_no_proprietary_refs.py would pass CI green.
        if: github.event_name != 'schedule'
        run: pytest ci/tests/ -q
      - name: Dependency vulnerability scan (pip-audit against the frozen lock)
        # Audits the EXACT production dependency set that ships in the image
        # (uv sync --frozen from uv.lock), not the floating pip-resolved dev env
        # installed above — so the scan matches what actually runs in production.
        run: |
          python -m pip install --upgrade uv
          uv export --frozen --no-dev --no-emit-project -o requirements.frozen.txt
          pip-audit --requirement requirements.frozen.txt

  swiss-ephemeris:
    name: Accuracy against real Swiss ephemeris data
    runs-on: ubuntu-latest
    # CALC-1. The `test` job above runs with NO ephemeris data files, so swisseph
    # silently substitutes its built-in Moshier analytical ephemeris and returns
    # plausible numbers — meaning this repo's entire automated suite had never once
    # validated the engine against the Swiss data files production is volume-mounted
    # with. A regression that only manifests with real data (a data-file-dependent
    # edge case, an off-by-epoch bug) could merge green.
    #
    # This job closes that: it fetches the four checksum-pinned data files, then runs
    # the WHOLE suite against them with REQUIRE_SWISS_EPHEMERIS=1, which makes
    # tests/test_swiss_ephemeris.py hard-FAIL rather than skip if swisseph turns out
    # to be on the fallback engine. Fail-closed throughout: a download failure, a
    # checksum mismatch, or an unpinned checksum all fail the job — never a warning,
    # because "the accuracy job went green on Moshier" is exactly the outcome this
    # exists to prevent. ci/tests/test_swiss_ephemeris_job.py parses this workflow and
    # fails if this job, its fetch step, or that env var goes missing.
    #
    # Skipped on the weekly schedule run for the same reason as the `test` job's
    # pytest step: nothing about the code or the data changed, only the CVE database.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # Cache keyed on the manifest, so changing a pinned checksum (or adding a
      # file) invalidates it — a stale cache can never satisfy a new pin. The
      # fetcher re-verifies every file on every run regardless of cache hit, so a
      # corrupted cache entry fails the job rather than being trusted.
      - name: Cache Swiss ephemeris data files
        uses: actions/cache@v4
        with:
          path: data/ephe
          key: swiss-ephe-${{ hashFiles('ci/swiss_ephemeris.json') }}

      - name: Self-test the checksum verifier
        # Ordering matters: a verifier that has stopped verifying must never get as
        # far as certifying the real download. These fixtures cover a mismatching
        # checksum, an unpinned (null) checksum, a missing file, a truncated file and
        # eight structurally invalid manifests.
        run: python ci/fetch_swiss_ephemeris.py --self-test

      - name: Fetch + verify the Swiss ephemeris data files
        run: python ci/fetch_swiss_ephemeris.py

      - name: Install the FROZEN dependency set
        # uv sync --frozen, not `pip install -e .`: the committed golden values are
        # only reproducible against a pinned resolve (pyswisseph 2.10.3.2, pyjhora
        # 4.8.6 — the same set the shipped image installs). A floating resolve would
        # turn a dependency's own numeric change into a mystery golden failure.
        run: |
          python -m pip install --upgrade uv
          uv sync --frozen --extra dev

      - name: Run the full suite against real Swiss data
        env:
          # Turns "Swiss data is not active" from a skip into a hard failure. Without
          # it this job could pass while quietly testing nothing new.
          REQUIRE_SWISS_EPHEMERIS: "1"
        run: uv run --frozen python -m pytest tests/ -q

  docker-test-image:
    name: Build Dockerfile.test
    runs-on: ubuntu-latest
    # CALC-7: Dockerfile.test is what scripts/test-in-docker.* runs locally to
    # exercise real Swiss ephemeris data, and it installs from uv.lock with
    # `--frozen` (fails closed on any pyproject.toml/uv.lock drift). Nothing
    # else in CI builds this image, so without this job a frozen-install
    # regression here would only surface for a contributor running the local
    # Docker loop, not on the PR itself. Skipped on the weekly schedule run —
    # same rationale as the "Run tests" step above, nothing about the image
    # changed, only the vulnerability database might have.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Same mirror.gcr.io routing as publish.yml — anonymous docker.io
          # pulls (the python:3.10-slim base) intermittently rate-limit on
          # GitHub-hosted runners.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
